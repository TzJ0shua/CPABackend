# URL do banco (usa variável de ambiente quando disponível; fallback local no Docker/host)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5433/cpa-femass}
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:postgres}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:Cp2af0em2as6s}

quarkus.hibernate-orm.sql-load-script=import.sql
quarkus.flyway.migrate-at-start=true

# CORS (dev local front-end)
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${QUARKUS_HTTP_CORS_ORIGINS:http://localhost:5173}

quarkus.http.host=0.0.0.0

# A documentação não deve ser registrada por padrão. O perfil dev a habilita abaixo.
quarkus.smallrye-openapi.enabled=false
quarkus.smallrye-openapi.path=/openapi

%dev.quarkus.smallrye-openapi.enabled=true
%dev.quarkus.smallrye-openapi.info-title=CPA Backend API
%dev.quarkus.smallrye-openapi.info-version=1.0.0
%dev.quarkus.smallrye-openapi.info-description=API do sistema de avaliacao institucional da FEMASS.
%dev.quarkus.swagger-ui.always-include=true
%dev.quarkus.swagger-ui.path=/swagger-ui

# Keycloak protege somente a API administrativa. Configure em produção sem versionar segredos.
quarkus.oidc.auth-server-url=${KEYCLOAK_AUTH_SERVER_URL:}
quarkus.oidc.client-id=${KEYCLOAK_CLIENT_ID:cpa-backend}
quarkus.oidc.application-type=service
quarkus.oidc.roles.role-claim-path=realm_access/roles
quarkus.oidc.token.audience=${KEYCLOAK_CLIENT_ID:cpa-backend}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization
quarkus.http.auth.permission.public.paths=/formulario,/formularios,/dados-formulario,/perguntas,/avaliacoes,/qrcode/*,/validacao/*,/verificacao-email/*,/campanhas/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.admin.paths=/admin,/admin/*
quarkus.http.auth.permission.admin.policy=authenticated

%test.quarkus.oidc.enabled=false

# Validade padrão dos códigos de validação: 14 dias, configurável por ambiente.
validacao.codigo-expiracao=${VALIDACAO_CODIGO_EXPIRACAO:PT336H}

# Verificacao de e-mail para professor e funcionario. Segredos devem ser definidos somente por ambiente.
verificacao-email.pin-expiracao=${VERIFICACAO_EMAIL_PIN_EXPIRACAO:PT2H}
verificacao-email.autorizacao-expiracao=${VERIFICACAO_EMAIL_AUTORIZACAO_EXPIRACAO:PT15M}
verificacao-email.max-tentativas=${VERIFICACAO_EMAIL_MAX_TENTATIVAS:5}
verificacao-email.max-reenvios-janela=${VERIFICACAO_EMAIL_MAX_REENVIOS_JANELA:3}
verificacao-email.janela-reenvio=${VERIFICACAO_EMAIL_JANELA_REENVIO:PT1H}
verificacao-email.email-digest-secret=${VERIFICACAO_EMAIL_DIGEST_SECRET:dev-only-change-me}
verificacao-email.gmail.enabled=${VERIFICACAO_EMAIL_GMAIL_ENABLED:false}
verificacao-email.gmail.client-id=${VERIFICACAO_EMAIL_GMAIL_CLIENT_ID:not-configured}
verificacao-email.gmail.client-secret=${VERIFICACAO_EMAIL_GMAIL_CLIENT_SECRET:not-configured}
verificacao-email.gmail.refresh-token=${VERIFICACAO_EMAIL_GMAIL_REFRESH_TOKEN:not-configured}
verificacao-email.gmail.from=${VERIFICACAO_EMAIL_GMAIL_FROM:not-configured}
verificacao-email.gmail.connect-timeout=${VERIFICACAO_EMAIL_GMAIL_CONNECT_TIMEOUT:PT10S}
verificacao-email.gmail.request-timeout=${VERIFICACAO_EMAIL_GMAIL_REQUEST_TIMEOUT:PT15S}

%test.verificacao-email.email-digest-secret=test-only-digest-secret
%test.verificacao-email.gmail.enabled=true
%test.verificacao-email.gmail.client-id=test-client-id
%test.verificacao-email.gmail.client-secret=test-client-secret
%test.verificacao-email.gmail.refresh-token=test-refresh-token
%test.verificacao-email.gmail.from=cpa-test@example.com
